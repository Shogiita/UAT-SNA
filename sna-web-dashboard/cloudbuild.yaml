steps:
  # Langkah 1: Build Docker Image
  - name: "gcr.io/cloud-builders/docker"
    id: "Build-Frontend-Image"
    dir: "sna-web-dashboard" # <--- INI KUNCINYA (Masuk ke folder frontend)
    args:
      - "build"
      - "-t"
      - "gcr.io/$PROJECT_ID/sna-web-dashboard:$SHORT_SHA"
      - "."

  # Langkah 2: Push Docker Image ke Google Container Registry (GCR)
  - name: "gcr.io/cloud-builders/docker"
    id: "Push-Frontend-Image"
    dir: "sna-web-dashboard" # <--- INI KUNCINYA
    args:
      - "push"
      - "gcr.io/$PROJECT_ID/sna-web-dashboard:$SHORT_SHA"

  # Langkah 3: Deploy ke Cloud Run
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: "Deploy-Frontend-Cloud-Run"
    dir: "sna-web-dashboard" # <--- INI KUNCINYA
    entrypoint: gcloud
    args:
      - "run"
      - "deploy"
      - "sna-web-dashboard"
      - "--image"
      - "gcr.io/$PROJECT_ID/sna-web-dashboard:$SHORT_SHA"
      - "--region"
      - "asia-southeast2"
      - "--platform"
      - "managed"
      - "--allow-unauthenticated"
      - "--port"
      - "8080"

images:
  - "gcr.io/$PROJECT_ID/sna-web-dashboard:$SHORT_SHA"
